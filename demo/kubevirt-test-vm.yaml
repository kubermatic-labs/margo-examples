# Edge test VM on the Kubermatic demo KubeVirt cluster (MCP kubernetes-kubev-dc), the device for
# the Margo onboarding tests ([device] tasks) and the demo guide docs/margo/demo-e2e.md of
# margo-management. Same as machine-setup/demo-test-vm/test-edge-prov.yaml of the SDA repo, which
# also uses it for the edge provider tests. ssh_authorized_keys holds the key of the person who runs
# the tests and the key of the operator, the Secret machine-ssh of that guide; put in yours.
#
# Follows the VMs already running on this cluster (tobi-demo-bastion, the KDP dev VMs):
#   - namespace kubermatic-virtualization, where all VMs of this cluster live
#   - storageClassName kubev-vms (Longhorn), Ubuntu 24.04 disk from quay.io/kubermatic-virt-disks
#   - pod network on the kube-ovn default subnet ovn-default (172.16.0.0/16, NAT egress) with the
#     cluster DNS, so no dnsConfig
#   - SSH from outside through a KubeLB LoadBalancer Service (second document), like the KDP dev
#     VMs. KubeLB does not apply loadBalancerSourceRanges, so port 22 is open to the internet:
#     key login only (ssh_pwauth: false).
#
#   kubectl -n kubermatic-virtualization get svc test-edge-prov   # EXTERNAL-IP
#   ssh ubuntu@<EXTERNAL-IP>
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test-edge-prov
  namespace: kubermatic-virtualization
  labels:
    kubevirt.io/vm: test-edge-prov
spec:
  dataVolumeTemplates:
  - metadata:
      creationTimestamp: null
      name: test-edge-prov
    spec:
      source:
        registry:
          pullMethod: node
          url: docker://quay.io/kubermatic-virt-disks/ubuntu:24.04-amd64
      storage:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 15G
        storageClassName: kubev-vms
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: test-edge-prov
      annotations:
        ovn.kubernetes.io/logical_switch: ovn-default
        # Lifts only the network blocker for live migration. The ReadWriteOnce disk still blocks
        # it (KubeVirt needs ReadWriteMany), so a drained worker restarts the VM on the other one.
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 2
        devices:
          disks:
          - disk:
              bus: virtio
            name: datavolumedisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - bridge: {}
            model: virtio
            name: default
          networkInterfaceMultiqueue: true
        machine:
          type: q35
        resources:
          limits:
            memory: 4G
          requests:
            memory: 4G
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - dataVolume:
          name: test-edge-prov
        name: datavolumedisk
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            package_update: true
            packages:
              - qemu-guest-agent
            ssh_pwauth: false
            ssh_authorized_keys:
              - ssh-rsa  tobi@loodse.com
              # The key of the margo-management operator, in its Secret machine-ssh.
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHVyKTMFye8QppsdmPqd5bFRYLLTLE9X9Sk8uh4S6xta kdp-margo-service
            runcmd:
              - [ systemctl, enable, --now, qemu-guest-agent ]
              - mkdir -p /root/.ssh
              - cp /home/ubuntu/.ssh/authorized_keys /root/.ssh/authorized_keys
        name: cloudinitdisk
---
# SSH from outside: KubeLB assigns a public IP, as for the KDP dev VMs on this cluster.
apiVersion: v1
kind: Service
metadata:
  name: test-edge-prov
  namespace: kubermatic-virtualization
spec:
  type: LoadBalancer
  loadBalancerClass: kubelb
  selector:
    kubevirt.io/vm: test-edge-prov
  ports:
  - name: ssh
    port: 22
    protocol: TCP
    targetPort: 22
