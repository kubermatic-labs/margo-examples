apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iaiops.fullname" . }}
  labels:
    {{- include "iaiops.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One MCP server per deployment: its state directory holds the audit trail.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "iaiops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iaiops.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iaiops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "%s-%s" .Chart.AppVersion .Values.profile) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: IAIOPS_MCP
              value: {{ .Values.profile | quote }}
            - name: IAIOPS_MCP_TRANSPORT
              value: streamable-http
            - name: IAIOPS_MCP_HOST
              value: 0.0.0.0
            - name: IAIOPS_MCP_PORT
              value: {{ int .Values.mcp.port | quote }}
            - name: IAIOPS_ALLOWLIST_IPS
              value: {{ .Values.mcp.allowlist | quote }}
            - name: IAIOPS_CONFIG
              value: /etc/iaiops/config.yaml
            - name: IAIOPS_HOME
              value: /home/iaiops/.iaiops
          ports:
            - name: mcp
              containerPort: {{ int .Values.mcp.port }}
          readinessProbe:
            tcpSocket:
              port: mcp
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/iaiops
              readOnly: true
            - name: state
              mountPath: /home/iaiops/.iaiops
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "iaiops.fullname" . }}
            defaultMode: 0440
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
