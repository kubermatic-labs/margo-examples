apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iaiops.fullname" . }}
  labels:
    {{- include "iaiops.labels" . | nindent 4 }}
data:
  # The endpoint and tag roles of the iaiops OEE demo line.
  config.yaml: |
    endpoints:
      - name: line1
        protocol: modbus
        host: {{ .Values.modbus.host | quote }}
        port: {{ int .Values.modbus.port }}
        unit_id: {{ int .Values.modbus.unitId }}
        ideal_cycle_time_s: {{ .Values.modbus.idealCycleTimeSeconds }}
        tags:
          - ref: "0"
            label: "Line run state"
            role: run_state
            running_when: [2]
          - ref: "10"
            label: "Production counter"
            role: total_count
          - ref: "11"
            label: "Good-parts counter"
            role: good_count
