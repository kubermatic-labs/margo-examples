{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oee-line-simulator.fullname" . }}
  labels:
    {{- include "oee-line-simulator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "oee-line-simulator.selectorLabels" . | nindent 4 }}
  ports:
    - name: modbus
      port: {{ int .Values.port }}
      targetPort: modbus
{{- end }}
